# All four W1 groupings x both execution modes, at every shape used so far:
#   p11 = separate   [bias add] [ReLU] [residual add]
#   p01 = first_pair [bias add + ReLU] [residual add]
#   p10 = last_pair  [bias add] [ReLU + residual add]
#   p00 = full       [bias add + ReLU + residual add]
# No partitions key, so all four are generated.
workload: w1
shapes: [[32, 256], [1024, 1024], [4096, 4096], [8192, 8192]]
device: cuda:0
modes: [launch, graph]
dtype: float32
layout: contiguous
seed: 0
rtol: 0.00001
atol: 0.000001
rounds: 5
window_seconds: 3.0
warmup_iterations: 3
max_partitions: 256
latency_tolerance: 0.05
exclusion_policy: none
eager_baseline: true
compiler_artifacts: false
