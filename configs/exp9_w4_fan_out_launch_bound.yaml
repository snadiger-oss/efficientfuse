# Experiment 9: W4 fan-out h - mean(h) at 256x4096 (largest screened shape where replay hides extra kernels).
# All four groupings x two modes (8 candidates) + eager. Screened first: partial+replay was within
# 1.05x of the best full-fusion runtime (results/bhargav/screening/screen_all.json).
# Replay reads GPU-resident inputs (copies only new/modified inputs), like ordinary mode.
workload: w4
shapes: [[256, 4096]]
device: cuda:0
modes: [launch, graph]
replay_input_refresh: on_change
gemm_backend: default
dtype: float32
layout: contiguous
seed: 0
rtol: 0.00001
atol: 0.00001
rounds: 5
window_seconds: 3.0
warmup_iterations: 3
max_partitions: 256
latency_tolerance: 0.05
exclusion_policy: none
eager_baseline: true
compiler_artifacts: false
