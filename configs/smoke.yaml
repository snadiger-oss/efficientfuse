# One complete W1 case. Full physical GPU allocation is asserted at runtime.
workload: w1
shapes: [[32, 256]]
device: cuda:0
modes: [launch, graph]
dtype: float32
layout: contiguous
seed: 0
rtol: 0.00001
atol: 0.000001
rounds: 5
window_seconds: 3.0
warmup_iterations: 3
max_partitions: 256
latency_tolerance: 0.05
exclusion_policy: none
eager_baseline: true
compiler_artifacts: false
