# Experiment 5: W3 reduction chain, gelu(layer_norm(x + residual)), 4096x4096 FP32, LayerNorm without affine.
# All four groupings x two execution modes = 8 compiled candidates, plus the eager baseline.
#   p11 = separate  p01 = first_pair  p10 = last_pair  p00 = full
workload: w3
shapes: [[4096, 4096]]
device: cuda:0
modes: [launch, graph]
gemm_backend: default
dtype: float32
layout: contiguous
seed: 0
rtol: 0.00001
atol: 0.00001
rounds: 5
window_seconds: 3.0
warmup_iterations: 3
max_partitions: 256
latency_tolerance: 0.05
exclusion_policy: none
eager_baseline: true
compiler_artifacts: false
